<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>ESTRUCTURAS DE CONTROL EN JS</h1>
    <ul>
        <li> Secuencial </li>
        <button id="demo">Ver demo</button>
        <p id="resultado1"></p>
        <p id="resultado2"></p>
        <li> Condicional </li>
    </ul>
    <ol>
        <il> If: </il>
        <il>If...else:</il>
        <il>If...else/if...else</il>
    </ol>
    <script>
        let boton= document.getElementById("demo")
        boton.addEventListener("click",function(){
        // 1. Entrada de datos
        let valor1 = prompt('Ingrese el primer número:');
        let valor2 = prompt('Ingrese el segundo número:');
        // 2. Selección de los elementos HTML
        let res1 = document.getElementById("resultado1");
        let res2 = document.getElementById("resultado2");
        // 3. Proceso (operaciones matemáticas)
        let suma = parseInt(valor1) + parseInt(valor2);
        let producto = parseInt(valor1) * parseInt(valor2);
        // 4. Salida
        res1.innerHTML = 'La suma es: ' + suma;
        res2.innerHTML = 'El producto es: ' + producto;
        })
    </script>
</body>
</html>
